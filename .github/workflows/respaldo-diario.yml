# Respaldo diario de Supabase + restauración de prueba en una base aislada + verificación de integridad.
# Pensado para Supabase Free (sin respaldos automáticos). Con Supabase Pro sigue sirviendo como copia
# externa e independiente del proveedor.
# Secretos requeridos (Settings → Secrets and variables → Actions):
#   SUPABASE_BACKUP_URL  conexión de ADMINISTRACIÓN por Session Pooler (puerto 5432, usuario postgres.<ref>)
#                        terminada en ?sslmode=require
#   BACKUP_PASSPHRASE    frase larga para cifrar el respaldo (guárdala fuera de GitHub)
name: Respaldo diario verificado
on:
  schedule:
    - cron: '17 9 * * *'   # 03:17 hora del centro de México
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      restore:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: restore-solo-ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SOURCE_URL: ${{ secrets.SUPABASE_BACKUP_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Verificar secretos
        run: |
          if [ -z "$SOURCE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Faltan SUPABASE_BACKUP_URL o BACKUP_PASSPHRASE. Ver docs/RESPALDOS.md"; exit 1; fi
      - uses: actions/checkout@v4
      - name: Cliente PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Respaldo, restauración aislada y verificación
        env:
          RESTORE_ADMIN_URL: postgres://postgres:restore-solo-ci@localhost:5432/postgres
          BACKUP_DIR: ${{ runner.temp }}/respaldos
        run: ./ops/backup-verify.sh
      - name: Cifrar respaldo
        run: |
          cd "${{ runner.temp }}/respaldos"
          for f in *.dump; do gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 -o "$f.gpg" "$f"; rm -f "$f"; done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: respaldo-vlux-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/respaldos/*.gpg
            ${{ runner.temp }}/respaldos/*.sha256
            ${{ runner.temp }}/respaldos/ULTIMO_RESPALDO_VERIFICADO.txt
          retention-days: 30
